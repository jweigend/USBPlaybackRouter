<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">USB Playback Router</title>
  <desc id="desc">Simplified tray-friendly icon showing USB audio routed between channel pairs 1/2 and 3/4.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18232d"/>
      <stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8dff00"/>
      <stop offset="1" stop-color="#39c600"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="96" fill="url(#bg)" stroke="#6dff00" stroke-width="12"/>

  <rect x="238" y="92" width="36" height="126" rx="18" fill="#f2f5f7"/>
  <rect x="222" y="128" width="68" height="54" rx="16" fill="#cfd6dc" stroke="#ffffff" stroke-width="4"/>
  <line x1="234" y1="142" x2="278" y2="142" stroke="#7f8a93" stroke-width="5" stroke-linecap="round"/>
  <line x1="234" y1="154" x2="278" y2="154" stroke="#7f8a93" stroke-width="5" stroke-linecap="round"/>
  <line x1="234" y1="166" x2="278" y2="166" stroke="#7f8a93" stroke-width="5" stroke-linecap="round"/>

  <path d="M256 218 V250 C256 264 246 276 232 282 L172 306" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 218 V250 C256 264 266 276 280 282 L340 306" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M160 301 L186 299 L174 324 Z" fill="#ffffff"/>
  <path d="M352 301 L326 299 L338 324 Z" fill="#ffffff"/>

  <rect x="92" y="308" width="150" height="98" rx="24" fill="#26323d" stroke="#5c6975" stroke-width="6"/>
  <text x="167" y="365" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="56" font-weight="700" fill="#ffffff">1/2</text>
  <text x="167" y="392" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="600" fill="#b6c0c8">MONITOR</text>

  <rect x="270" y="308" width="150" height="98" rx="24" fill="url(#active)" stroke="#b8ff3d" stroke-width="6"/>
  <text x="345" y="365" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="56" font-weight="700" fill="#ffffff">3/4</text>
  <text x="345" y="392" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700" fill="#ffffff">PLAYBACK</text>

  <g transform="translate(166 424)" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 24 H46"/>
    <path d="M46 24 V0"/>
    <path d="M46 24 L68 2"/>
    <path d="M46 24 L68 46"/>
