[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "usb-playback-router"
version = "0.1.1"
description = "Choose which stereo pair of a multichannel USB audio interface receives Linux desktop audio"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Johannes Weigend" }]
requires-python = ">=3.11"
keywords = ["pipewire", "audio", "usb", "mixer", "tray", "linux"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
# Runtime needs are system packages, not pip packages: pipewire-bin,
# python3-gi with GTK 3, and a tray backend (XApp or AyatanaAppIndicator3).
dependencies = []

[project.urls]
Homepage = "https://github.com/jweigend/USBPlaybackRouter"

[project.scripts]
usb-playback-router = "usb_playback_router.cli:main"

[tool.setuptools]
packages = ["usb_playback_router"]

[tool.setuptools.package-data]
usb_playback_router = ["devices.toml", "icon.svg"]
